[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-extractor"
version = "0.1.0"
description = "Fetch YouTube transcripts, save them as Markdown, and email AI-generated summaries."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.9",
    "youtube-transcript-api>=1.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "APScheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yt-transcript = "transcript_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
