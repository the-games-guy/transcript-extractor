[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-extractor"
version = "0.2.0"
description = "Web app that saves YouTube transcripts into an Obsidian vault, on demand or on a schedule."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "waitress>=3.0",
    "youtube-transcript-api>=1.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "APScheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
transcript-extractor = "transcript_extractor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transcript_extractor = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
